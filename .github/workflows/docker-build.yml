name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Single source of truth for the image version label: SERVER_VERSION in the server code
      - name: Read server version
        id: version
        run: |
          VERSION=$(sed -n 's/^SERVER_VERSION = "\(.*\)"$/\1/p' mcp-server/apple_docs_mcp.py)
          if [ -z "$VERSION" ]; then
            echo "::error::SERVER_VERSION not found in mcp-server/apple_docs_mcp.py"
            exit 1
          fi
          echo "server_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # {{branch}} is empty on pull_request events, which made the sha tag
          # invalid (":-<sha>-<date>"); PR builds use the pr-N tag instead
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDD'}},format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.server_version }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get build timestamps
        id: timestamps
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%MZ)" >> $GITHUB_OUTPUT
          # Query GitHub API for last commit to documentation/ (avoids full clone)
          # Truncate to minute precision (YYYY-MM-DDTHH:MMZ)
          DOCS_DATE=$(gh api "repos/${{ github.repository }}/commits?path=documentation/&per_page=1" \
            --jq '.[0].commit.author.date' 2>/dev/null | cut -c1-16)
          if [ -n "$DOCS_DATE" ]; then
            echo "docs_updated=${DOCS_DATE}Z" >> $GITHUB_OUTPUT
          else
            echo "docs_updated=unknown" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mcp-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SERVER_VERSION=${{ steps.version.outputs.server_version }}
            BUILD_TIME=${{ steps.timestamps.outputs.build_time }}
            DOCS_UPDATED=${{ steps.timestamps.outputs.docs_updated }}
      
      - name: Deploy to VPS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Any failing command fails the deploy step instead of reporting success
            set -e
            cd /root/apple-dev-docs || exit 1

            # Pull latest files from repo
            git fetch origin main
            git checkout origin/main -- mcp-server/docker-compose.yml
            git checkout origin/main -- landing/

            # Deploy landing page to web root
            mkdir -p /var/www/xdocs
            cp -r landing/* /var/www/xdocs/

            # Pull while the old container keeps serving, then swap it for a
            # fresh one (the outage is only the swap, not the image download)
            cd mcp-server || exit 1
            docker compose pull && docker compose up -d --remove-orphans --force-recreate || exit 1

            # Cleanup
            docker image prune -f

            echo "Deployed successfully!"

      - name: Generate deployment summary
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          echo "## Deployed to VPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MCP endpoint: \`https://xdocs.dev/mcp\`" >> $GITHUB_STEP_SUMMARY