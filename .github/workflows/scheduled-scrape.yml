name: Scheduled Documentation Scrape

on:
  workflow_dispatch:  # Triggered from VPS cron or manually

# Prevent multiple scrape runs from overlapping
concurrency:
  group: scrape-docs
  cancel-in-progress: false  # Let running scrape finish

jobs:
  scrape-docs:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 420  # 7 hour limit (Apple ~5h + MLX ~30min + buffer)

    permissions:
      contents: write  # Needed to push commits
      actions: write   # Needed to trigger docker-build workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check disk space
        run: df -h

      # Python 3.12 for wafer-py (requirements-scrape.txt, the MLX Sphinx pages);
      # the Docker image stays on 3.11 and never installs that file.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-scrape.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-scrape.txt

      # The five scrape steps continue on error, so one scraper's failure never
      # blocks the others or the commit of their doc updates; the last step
      # (Fail if a scrape step failed) fails the run from their outcomes.
      - name: Clean up removed frameworks
        id: cleanup_removed
        continue-on-error: true  # exits 1 when technologies.json can't be fetched
        run: python scripts/utilities/cleanup_removed_frameworks.py --yes

      # === Apple Developer Documentation ===
      - name: Run Apple frameworks scraper
        id: apple
        continue-on-error: true
        timeout-minutes: 330
        run: python scrape.py --all --yes --cleanup-orphans --auto-cleanup

      - name: Run Swift language docs scraper
        id: swift
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrape_swift_docs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run HIG (Human Interface Guidelines) scraper
        id: hig
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/scrape_hig_docs.py

      # === ML Documentation (MLX, coremltools, etc.) ===
      - name: Run MLX/coremltools docs scraper
        id: mlx
        continue-on-error: true
        timeout-minutes: 60
        run: python scripts/scrape_mlx_docs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected:"
            git diff --staged --stat | tail -20
          fi

      - name: Update landing page stats and sitemap
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Generate date strings
          MONTH_DAY=$(date +"%-b %-d")  # e.g., "Jan 11"
          TODAY=$(date +"%Y-%m-%d")     # e.g., "2026-01-11"

          # Count documents and frameworks
          DOC_COUNT=$(find documentation -name "*.md" | wc -l | xargs)
          FRAMEWORK_COUNT=$(find documentation -mindepth 1 -maxdepth 1 -type d | wc -l | xargs)

          # Validate counts, use fallbacks if suspicious
          if [[ ! "$DOC_COUNT" =~ ^[0-9]+$ ]] || [ "$DOC_COUNT" -lt 300000 ]; then
            echo "::warning::Unexpected document count ($DOC_COUNT), using fallback"
            DOC_DISPLAY="322,000+"
          else
            DOC_DISPLAY=$(echo "$DOC_COUNT" | sed ':a;s/\B[0-9]\{3\}\>$/,&/;ta')
          fi
          if [[ ! "$FRAMEWORK_COUNT" =~ ^[0-9]+$ ]] || [ "$FRAMEWORK_COUNT" -lt 300 ]; then
            echo "::warning::Unexpected framework count ($FRAMEWORK_COUNT), using fallback"
            FRAMEWORK_COUNT="390+"
          fi

          echo "Documents: $DOC_DISPLAY, Frameworks: $FRAMEWORK_COUNT, Date: $MONTH_DAY"

          # Validate date formats before sed
          if [[ ! "$MONTH_DAY" =~ ^[A-Z][a-z]{2}\ [0-9]{1,2}$ ]]; then
            echo "::error::Invalid date format: $MONTH_DAY"
            exit 1
          fi
          if [[ ! "$TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid date format: $TODAY"
            exit 1
          fi

          # Update landing page stats using IDs for precise targeting
          sed -i "s|id=\"stat-documents\">[^<]*<|id=\"stat-documents\">${DOC_DISPLAY}<|" landing/index.html
          sed -i "s|id=\"stat-frameworks\">[^<]*<|id=\"stat-frameworks\">${FRAMEWORK_COUNT}<|" landing/index.html
          sed -i "s|id=\"stat-updated\">[^<]*<|id=\"stat-updated\">${MONTH_DAY}<|" landing/index.html

          # Update sitemap lastmod
          sed -i "s|<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}</lastmod>|<lastmod>${TODAY}</lastmod>|" landing/sitemap.xml

          # Verify changes were made
          if ! grep -q "stat-documents\">${DOC_DISPLAY}<" landing/index.html; then
            echo "::warning::Landing page documents may not have updated"
          fi
          if ! grep -q "stat-frameworks\">${FRAMEWORK_COUNT}<" landing/index.html; then
            echo "::warning::Landing page frameworks may not have updated"
          fi
          if ! grep -q "stat-updated\">${MONTH_DAY}<" landing/index.html; then
            echo "::warning::Landing page date may not have updated"
          fi
          if ! grep -q "<lastmod>${TODAY}</lastmod>" landing/sitemap.xml; then
            echo "::warning::Sitemap lastmod may not have updated"
          fi

          git add landing/index.html landing/sitemap.xml

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated docs update $(date +'%Y-%m-%d')"
          git push

      - name: Trigger Docker build
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "Waiting 5 minutes for commit to propagate..."
          sleep 300
          gh workflow run docker-build.yml
          echo "Docker build workflow triggered"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Documentation Scrape Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scrapers Run" >> $GITHUB_STEP_SUMMARY
          echo "- Apple Developer Documentation (370+ frameworks)" >> $GITHUB_STEP_SUMMARY
          echo "- Swift Language Documentation" >> $GITHUB_STEP_SUMMARY
          echo "- Human Interface Guidelines (HIG)" >> $GITHUB_STEP_SUMMARY
          echo "- MLX/coremltools Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "**Result:** Changes detected and committed. Docker build triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** No changes detected. Documentation is up to date." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Disk Usage" >> $GITHUB_STEP_SUMMARY
          df -h | grep -E '^/dev|Filesystem' >> $GITHUB_STEP_SUMMARY

      # Runs after the commit, deploy and summary so it can never block doc
      # updates; it only fails the run if .gitignore is silently dropping scraped docs.
      # A *.tmp file is a doc write's temp file (left only if its step was killed
      # mid-write), never a doc.
      - name: Check no docs are git-ignored
        run: |
          IGNORED=$(git ls-files --others --ignored --exclude-standard -- documentation ':(exclude)*.tmp')
          if [ -n "$IGNORED" ]; then
            echo "::error::$(echo "$IGNORED" | wc -l | xargs) documentation files are ignored by .gitignore and never committed"
            echo "$IGNORED" | head -50
            exit 1
          fi
          echo "No ignored documentation files"

      # Last step, always run: fails the run if any scrape step failed. It reads
      # each step's outcome, since with continue-on-error its conclusion is
      # always success (a step skipped because an earlier step failed counts too).
      - name: Fail if a scrape step failed
        if: always()
        env:
          CLEANUP_REMOVED: ${{ steps.cleanup_removed.outcome }}
          APPLE: ${{ steps.apple.outcome }}
          SWIFT: ${{ steps.swift.outcome }}
          HIG: ${{ steps.hig.outcome }}
          MLX: ${{ steps.mlx.outcome }}
        run: |
          FAILED=""
          [ "$CLEANUP_REMOVED" = "success" ] || FAILED="$FAILED cleanup_removed_frameworks=$CLEANUP_REMOVED"
          [ "$APPLE" = "success" ] || FAILED="$FAILED apple=$APPLE"
          [ "$SWIFT" = "success" ] || FAILED="$FAILED swift=$SWIFT"
          [ "$HIG" = "success" ] || FAILED="$FAILED hig=$HIG"
          [ "$MLX" = "success" ] || FAILED="$FAILED mlx=$MLX"
          if [ -n "$FAILED" ]; then
            echo "::error::Scrape steps that didn't succeed:$FAILED (see each step's log)"
            echo "**Failed scrape steps:**$FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All scrape steps succeeded"
