name: Scheduled MLX Documentation Scrape

on:
  schedule:
    # Every Monday at 5:00 AM UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:  # Manual trigger button

# Prevent multiple scrape runs from overlapping
concurrency:
  group: scrape-mlx-docs
  cancel-in-progress: false  # Let running scrape finish

jobs:
  scrape-mlx-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour limit (ML docs are smaller than Apple docs)

    permissions:
      contents: write  # Needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MLX/coremltools docs scraper
        run: python scripts/scrape_mlx_docs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected:"
            git diff --staged --stat | tail -20
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "MLX/coremltools docs update $(date +'%Y-%m-%d')"
          git push

      - name: Summary
        run: |
          echo "## MLX Documentation Scrape Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "Changes detected and committed. Docker build will trigger automatically." >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes detected. Documentation is up to date." >> $GITHUB_STEP_SUMMARY
          fi
