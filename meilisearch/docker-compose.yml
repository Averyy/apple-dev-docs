services:
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: apple-docs-meilisearch-local
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-local_test_key}
      - MEILI_ENV=development
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_LOG_LEVEL=INFO
      # Limit memory to simulate production constraints
      - MEILI_MAX_INDEXING_MEMORY=1500Mb
      - MEILI_HTTP_PAYLOAD_SIZE_LIMIT=200MB
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Memory limit to simulate production VPS (3GB container limit)
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  meilisearch_data:
    driver: local