[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; Each program's shell execs its final process, so supervisord's stop signal reaches the
; process itself, and stopasgroup/killasgroup also stop anything it started: a restart
; (supervisorctl restart, or autorestart) never leaves the old process running (an orphaned
; server kept port 8000, and the new one looped on "address already in use")
[program:meilisearch]
command=bash -c 'echo "Starting Meilisearch with:" && echo "  DB Path: /data/meilisearch" && echo "  Master Key: [REDACTED]" && echo "  Contents of /data/meilisearch:" && ls -la /data/meilisearch/ && exec /usr/bin/meilisearch --db-path /data/meilisearch --http-addr 0.0.0.0:7700 --master-key $MEILI_MASTER_KEY --log-level INFO'
directory=/data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/meilisearch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=MEILI_NO_ANALYTICS="true"
priority=1

[program:startup-check]
command=python /app/mcp-server/scripts/startup_check.py
directory=/app
autostart=true
; Never restart it: when the indexer exits 1 (a failed Meilisearch task), Meilisearch and
; the MCP server keep serving the index as it is, and restarting would loop a deterministic
; failure (for a full rebuild, ~20 minutes each time)
autorestart=false
startsecs=0
exitcodes=0
; A stop also stops the indexer it runs, so a restart never runs two indexers at once
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/startup-check.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1",MEILI_MASTER_KEY="%(ENV_MEILI_MASTER_KEY)s",MEILI_HTTP_ADDR="%(ENV_MEILI_HTTP_ADDR)s"
priority=5

[program:mcp-server]
command=sh -c 'sleep 5 && until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done && exec python /app/mcp-server/apple_docs_mcp.py --host 0.0.0.0 --port %(ENV_HTTP_PORT)s'
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/mcp-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1",MEILI_MASTER_KEY="%(ENV_MEILI_MASTER_KEY)s",MEILI_HTTP_ADDR="%(ENV_MEILI_HTTP_ADDR)s",MEILI_SEARCH_KEY="%(ENV_MEILI_SEARCH_KEY)s",MCP_API_KEY="%(ENV_MCP_API_KEY)s",HTTP_PORT="%(ENV_HTTP_PORT)s"
priority=100

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
