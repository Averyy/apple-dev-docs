# Local testing compose - builds from source instead of pulling GHCR
services:
  apple-docs-mcp:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
      # No platform pin: local builds run the host's native architecture
      # (arm64 on Apple Silicon — the amd64 Meilisearch release binary
      # segfaults under QEMU emulation). CI builds linux/amd64 for prod.
    container_name: apple-docs-mcp-local
    ports:
      - "8001:8000"
    environment:
      - MEILI_MASTER_KEY=test123
      - MEILI_SEARCH_KEY=test123
      - MCP_API_KEY=test123
      - HTTP_PORT=8000
      - MEILI_HTTP_ADDR=http://localhost:7700
      - MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE=true
      - RATE_LIMIT_REQUESTS=60
      - PYTHONUNBUFFERED=1
      - DOCUMENTATION_PATH=/data/documentation
      - MEILISEARCH_PATH=/data/meilisearch
    volumes:
      - meilisearch-local:/data/meilisearch
      - logs-local:/data/logs
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3"
    healthcheck:
      # Same app-level health semantics as production compose
      test: ["CMD-SHELL", "curl -f -H \"Host: $${ALLOWED_HOSTS%%,*}\" \"http://localhost:$${HTTP_PORT:-8000}/health\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  meilisearch-local:
  logs-local:
